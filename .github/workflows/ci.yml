name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build
      # Opens a sample of every kind of screen at a laptop and a phone size and fails on anything new that's
      # cut off, off the window, drawn over something else or broken (see e2e/sweep.mjs).
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium webkit firefox
      - run: node e2e/sweep.mjs --quick
      # The same sample in Safari's engine (every browser on an iPhone uses it) and in Firefox. Linux's WebKit build
      # drops page loads now and then, so these report (in the artifact) without failing the run.
      - run: node e2e/sweep.mjs --quick --browser=webkit --name=webkit
        continue-on-error: true
      - run: node e2e/sweep.mjs --quick --sizes=laptop --browser=firefox --name=firefox
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: other-browsers
          path: e2e/out/
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sweep
          path: e2e/out/
