<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

      name="description"
      content="Satisfactory production calculator. Machines, recipes, belts and power for a factory, power plants and their fuel, a searchable Codex of the game data and a map of resource nodes. Free and open source."
    />

    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="FICSIT Planner" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#151516" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FICSIT Planner" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="FICSIT Planner: Satisfactory production calculator" />
    <meta
      property="og:description"
      content="Machines, recipes, belts and power for a factory, power plants and their fuel, a Codex of the game data and a map of resource nodes. Free and open source."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FICSIT Planner showing the factory for 10 motors a minute" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FICSIT Planner: Satisfactory production calculator" />
    <meta
      name="twitter:description"
      content="Machines, recipes, belts and power for a factory, power plants and their fuel, a Codex of the game data and a map of resource nodes. Free and open source."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />
    <meta name="twitter:image:alt" content="FICSIT Planner showing the factory for 10 motors a minute" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FICSIT" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "FICSIT Planner",
        "alternateName": "Satisfactory production calculator",
        "url": "%SITE_URL%/",
        "image": "%SITE_URL%/og-image.jpg",
        "description": "Free production calculator and factory planner for the game Satisfactory. Pick what to build and get the machines, recipes, belts and power, with somersloops, power shards and resource limits.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and WebAssembly",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://www.gnu.org/licenses/gpl-3.0.html",
        "codeRepository": "https://github.com/Albis0/ficsit_planner",
        "about": { "@type": "VideoGame", "name": "Satisfactory" }
      }
    </script>

    <!-- Shown until the app starts, and to crawlers that don't run scripts. -->
    <style>
      body {
        margin: 0;
        background: #151516;
      }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 100000;
        overflow: auto;
        transition: opacity 0.2s;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        background: #151516;
        color: #a9aeb3;
        font: 16px / 1.5 'Segoe UI', system-ui, sans-serif;
      }
      .boot.boot-out {
        opacity: 0;
        pointer-events: none;
      }
      @supports (height: 100dvh) {
        .boot {
          min-height: 100dvh;
        }
      }
      .boot h1 {
        margin: 0;
        color: #fa9549;
        font: 700 34px / 1.1 'Arial Narrow', sans-serif;
        letter-spacing: 0.06em;
      }
      .boot p {
        margin: 0;
        max-width: 34em;
      }
      .boot-load {
        display: grid;
        gap: 8px;
        justify-items: center;
        margin-top: 8px;
        color: #fa9549;
        font: 700 16px / 1 'Arial Narrow', sans-serif;
        letter-spacing: 0.06em;
      }
      .boot-bar {
        position: relative;
        width: min(260px, 70vw);
        height: 6px;
        overflow: hidden;
        background: #292929;
        border: 1px solid #474747;
      }
      .boot-bar i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        background: #fa9549;
        animation: boot-slide 1.4s ease-in-out infinite;
      }
      .boot-slow {
        opacity: 0;
        animation: boot-show 0.4s 6s forwards;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }
      @keyframes boot-show {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar i {
          width: 100%;
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
    <noscript>
      <style>
        .boot-load,
        .boot-slow {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <main class="boot" id="boot">
      <h1>FICSIT Planner</h1>
      <p>
        Production calculator for Satisfactory. Enter the items you want per minute to get the machines, recipes,
        belts and power.
      </p>
      <div class="boot-load" role="status">
        <span id="boot-text">Loading game data…</span>
        <span class="boot-bar"><i></i></span>
      </div>
      <p class="boot-slow">Slow connection, still loading.</p>
      <noscript><p>FICSIT Planner needs JavaScript. Turn it on and reload the page.</p></noscript>
    </main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
